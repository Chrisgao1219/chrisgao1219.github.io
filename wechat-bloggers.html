function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function getCats(b) { return (b.categories && b.categories.length) ? b.categories : []; }

let activeCategory = 'all';
const TOTAL = BLOGGERS.length;

function buildFilterBar() {
  const bar = document.getElementById('filterBar');
  document.getElementById('countAll').textContent = '(' + TOTAL + ')';
  CATEGORIES.forEach(cat => {
    const count = BLOGGERS.filter(b => getCats(b).includes(cat)).length;
    const btn = document.createElement('button');
    btn.className = 'filter-pill';
    btn.dataset.cat = cat;
    btn.innerHTML = cat + '<span class="count">' + count + '</span>';
    btn.addEventListener('click', () => {
      bar.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = cat;
      render();
    });
    bar.appendChild(btn);
  });
  bar.querySelector('[data-cat="all"]').addEventListener('click', () => {
    bar.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    bar.querySelector('[data-cat="all"]').classList.add('active');
    activeCategory = 'all';
    render();
  });
}

    : '「' + activeCategory + '」' + list.length + ' 个 / 共 ' + TOTAL + ' 个';

  if (list.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>该领域暂无公众号</p></div>';
    return;
  }

  grid.innerHTML = list.map(b => {
    const avatarHtml = b.avatar
      ? '<img src="' + esc(b.avatar) + '" alt="' + esc(b.name) + '" loading="lazy">'
      : esc((b.nickname || b.name).charAt(0));
    const meta = (b.nickname && b.nickname !== b.name)
      ? '<div class="blogger-meta">@' + esc(b.nickname) + '</div>'
      : '';
    return '<div class="card">'
      + '<div class="card-top"><div class="avatar">' + avatarHtml + '</div>'
      + '<div class="name-group"><div class="account-name">' + esc(b.name) + '</div>' + meta + '</div></div>'
      + '<div class="cat-tags">' + getCats(b).map(tagHTML).join('') + '</div>'
      + '<p class="card-desc">' + esc(b.description) + '</p>'
      + '</div>';
  }).join('');
}

buildFilterBar();
render();
</script>
</body>
</html>
