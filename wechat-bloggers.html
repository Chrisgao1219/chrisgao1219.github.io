<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="跨境优质公众号导航：亚马逊、独立站、SEO、AI、联盟营销等领域的公众号合集，点击卡片微信扫码直达公众号主页。">
<title>跨境优质公众号导航</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f6fa;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text2: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --radius: 14px;
    --accent: #0d9488;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #0d9488 0%, #4f46e5 100%);
    color: #fff; padding: 56px 24px 48px; text-align: center;
  }
  .header-inner { max-width: 860px; margin: 0 auto; }
  .header h1 { font-size: clamp(30px, 4.2vw, 40px); font-weight: 800; margin-bottom: 14px; letter-spacing: -.02em; }
  .header p { font-size: 16px; opacity: .9; }
  .header-tip {
    margin-top: 18px; display: inline-block; padding: 8px 16px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2);
    font-size: 13px; opacity: .85;
  }
  .count-note { margin-top: 10px; font-size: 13px; opacity: .65; }

  /* ===== 筛选栏 ===== */
  .controls {
    position: sticky; top: 0; z-index: 900;
    background: rgba(245,246,250,.92);
    backdrop-filter: blur(12px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
  }
  .controls-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filter-label { font-size: 13px; font-weight: 600; color: var(--text2); white-space: nowrap; }
  .filter-pill {
    font-size: 12.5px; font-weight: 600; padding: 5px 14px; border-radius: 999px;
    border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text2);
    cursor: pointer; transition: all .2s ease; white-space: nowrap; user-select: none;
  }
  .filter-pill:hover { border-color: var(--accent); color: var(--accent); }
  .filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-pill .count { font-size: 11px; margin-left: 2px; opacity: .72; }
  .result-hint { font-size: 13px; color: var(--text2); white-space: nowrap; margin-top: 8px; }

  /* ===== 卡片网格 ===== */
  .grid {
    max-width: 1200px; margin: 0 auto; padding: 26px 24px 56px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px;
  }
  .card {
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 22px; display: flex; flex-direction: column; gap: 12px; border: 1px solid transparent;
    cursor: pointer; position: relative;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover { box-shadow: 0 10px 25px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.06); transform: translateY(-2px); border-color: #99f6e4; }
  .card:active { transform: translateY(0); }
  .card-arrow {
    position: absolute; top: 18px; right: 16px; font-size: 13px; color: #b7bfcd;
    transition: all .2s ease;
  }
  .card:hover .card-arrow { color: var(--accent); right: 12px; }
  .card-top { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    background: linear-gradient(135deg, #ccfbf1, #a7f3d0); color: #0d9488;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .name-group { min-width: 0; flex: 1; }
  .account-name { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blogger-meta { font-size: 12.5px; color: var(--text2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .card-desc {
    font-size: 13.5px; color: #4b5563; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text2); }
  .empty-state .icon { font-size: 44px; margin-bottom: 12px; }

  .footer {
    text-align: center; padding: 24px 20px 40px; font-size: 13px; color: #8b95a5;
    border-top: 1px solid var(--border);
  }
  .footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .footer a:hover { text-decoration: underline; }
  /* ===== 扫码弹窗 ===== */
  .qr-modal {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(15,23,42,.58); z-index: 1000;
  }
  .qr-modal.is-open { display: flex; }
  .qr-panel {
    width: min(88vw, 360px); background: #fff; border-radius: 24px;
    box-shadow: 0 30px 70px rgba(15,23,42,.28); padding: 26px 24px 24px;
    position: relative; text-align: center;
  }
  .qr-close {
    position: absolute; top: 12px; right: 12px; width: 34px; height: 34px;
    border: 0; border-radius: 50%; background: #f3f4f6; color: #6b7280;
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .qr-close:hover { background: #e5e7eb; }
  .qr-title { font-size: 19px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .qr-subtitle { font-size: 12.5px; color: var(--text2); margin-bottom: 16px; line-height: 1.6; }
  .qr-box {
    width: 100%; max-width: 240px; aspect-ratio: 1; margin: 0 auto; padding: 10px;
    border: 1px solid var(--border); border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .qr-box canvas, .qr-box img { width: 100%; height: 100%; display: block; }
  .qr-account {
    font-size: 15px; font-weight: 700; color: #111827; margin-top: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .qr-hint { font-size: 12px; color: var(--text2); margin-top: 6px; }

  @media (max-width: 768px) {
    .header { padding: 40px 20px 38px; }
    .grid { grid-template-columns: 1fr; padding: 20px 16px 40px; gap: 14px; }
    .qr-panel { width: min(92vw, 340px); padding: 24px 18px 20px; }
    .qr-box { max-width: 220px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <h1>📮 跨境优质公众号导航</h1>
    <p>亚马逊 · 独立站 · SEO · AI · 联盟营销｜跨境从业者值得关注的公众号合集</p>
    <div class="header-tip">📱 点击卡片，微信扫码直达公众号主页</div>

</header>

<footer class="footer">

"link":"https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=MzIwNzgyNzE2OQ=="},{"name":"安然和她的朋友们","nickname":"安然和她的朋友们","avatar":"avatar_images/anran_e691c.png","description":"出海从业者社群，分享 AI 工具与工作流实战、线下活动干货","categories":["AI学习应用"],"link":"https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=MzU3NDkwNDQ2MA=="},{"name":"蚂蚁蚂蚁吼","nickname":"蚂蚁蚂蚁吼","avatar":"avatar_images/mayi_iuoy2.png","description":"深耕出海 SEO 与 GEO，分享 AI 时代的内容优化与自然流量获取思考","categories":["SEO/内容营销","AI学习应用"],"link":"https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=MzAxNzQ2MjMyOQ=="},{"name":"若凡SEO优化","nickname":"若凡","avatar":"avatar_images/ruofan_zf2sd.png","description":"SEO 优化实战团队，关键词规划、内容优化与 AI 运营落地复盘","categories":["SEO/内容营销","AI学习应用"],"link":"https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=MzIxODQzOTM2Ng=="}]
const CATEGORIES = ["亚马逊运营","AI学习应用","独立站/DTC","SEO/内容营销","联盟营销","站外推广","海外红人&社媒运营","供应链/物流","财税/合规","产品开发"];
const CAT_COLORS = {"亚马逊运营":["#eff6ff","#2563eb"],"AI学习应用":["#f5f3ff","#7c3aed"],"独立站/DTC":["#ecfdf5","#059669"],"SEO/内容营销":["#fff7ed","#ea580c"],"联盟营销":["#f0fdfa","#0d9488"],"站外推广":["#fef2f2","#dc2626"],"供应链/物流":["#fefce8","#ca8a04"],"财税/合规":["#fdf2f8","#be185d"],"海外红人&社媒运营":["#ecfeff","#0891b2"],"产品开发":["#f7fee7","#65a30d"]};
const DEFAULT_COLOR = ["#f3f4f6","#6b7280"];

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function getCats(b) { return (b.categories && b.categories.length) ? b.categories : []; }

let activeCategory = 'all';
const TOTAL = BLOGGERS.length;

// 置顶公众号（按顺序排最前）：前两位为第一排，后三位为第二排
const PINNED = ['Affiliate Wayne', '跨境老登火箭叔Alex', '下班后8小时', 'Terry的美妙工作流', 'SEO小平'];

// 排序规则：置顶 > 含独立站/DTC 分类 > 其余（含亚马逊，保持原顺序）
function bloggerRank(b) {
  const i = PINNED.indexOf(b.name);
  if (i >= 0) return i;
  return 100 + (getCats(b).includes('独立站/DTC') ? 0 : 50);
}

function buildFilterBar() {
  const bar = document.getElementById('filterBar');
  document.getElementById('countAll').textContent = '(' + TOTAL + ')';
  CATEGORIES.forEach(cat => {
    const count = BLOGGERS.filter(b => getCats(b).includes(cat)).length;
    const btn = document.createElement('button');
    btn.className = 'filter-pill';
    btn.dataset.cat = cat;
    btn.innerHTML = cat + '<span class="count">' + count + '</span>';
    btn.addEventListener('click', () => {
      bar.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = cat;
      render();
    });
    bar.appendChild(btn);
  });
  bar.querySelector('[data-cat="all"]').addEventListener('click', () => {
    bar.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    bar.querySelector('[data-cat="all"]').classList.add('active');
    activeCategory = 'all';
    render();
  });
}

function tagHTML(cat) {
  const c = CAT_COLORS[cat] || DEFAULT_COLOR;
  return '<span style="display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:10px;background:' + c[0] + ';color:' + c[1] + '">' + esc(cat) + '</span>';
}

function render() {
  const grid = document.getElementById('cardGrid');
  const hint = document.getElementById('resultHint');
  const list = (activeCategory === 'all'
    ? BLOGGERS
    : BLOGGERS.filter(b => getCats(b).includes(activeCategory)))
    .slice().sort((a, b) => bloggerRank(a) - bloggerRank(b));

  hint.textContent = activeCategory === 'all'
    ? '共 ' + TOTAL + ' 个公众号，点击卡片查看二维码'
    : '「' + activeCategory + '」' + list.length + ' 个 / 共 ' + TOTAL + ' 个';

  if (list.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>该领域暂无公众号</p></div>';
    return;
  }

  grid.innerHTML = list.map(b => {
    const avatarHtml = b.avatar
      ? '<img src="' + esc(b.avatar) + '" alt="' + esc(b.name) + '" loading="lazy">'
      : esc((b.nickname || b.name).charAt(0));
    const meta = (b.nickname && b.nickname !== b.name)
      ? '<div class="blogger-meta">@' + esc(b.nickname) + '</div>'
      : '';
    return '<div class="card" data-idx="' + BLOGGERS.indexOf(b) + '" title="点击查看公众号二维码">'
      + '<span class="card-arrow">↗</span>'
      + '<div class="card-top"><div class="avatar">' + avatarHtml + '</div>'
      + '<div class="name-group"><div class="account-name">' + esc(b.name) + '</div>' + meta + '</div></div>'
      + '<div class="cat-tags">' + getCats(b).map(tagHTML).join('') + '</div>'
      + '<p class="card-desc">' + esc(b.description) + '</p>'
      + '</div>';
  }).join('');
}

buildFilterBar();
render();

// ===== 扫码关注弹窗 =====
const qrModal = document.getElementById('qrModal');
const qrClose = document.getElementById('qrClose');
const qrBox = document.getElementById('qrBox');
const qrAccountName = document.getElementById('qrAccountName');
let qrInstance = null;

function isWeChatBrowser() { return /MicroMessenger/i.test(navigator.userAgent); }
function isWechatProfileLink(link) { return typeof link === 'string' && link.includes('/mp/profile_ext'); }
function normalizeWechatInAppLink(link) {
  if (typeof link !== 'string') return link;
  if (!/mp\.weixin\.qq\.com/.test(link)) return link;
  if (/#wechat_redirect$/.test(link)) return link;
  return link + '#wechat_redirect';
}

function renderQrCode(text) {
  qrBox.innerHTML = '';
  if (typeof QRCode !== 'function') { qrBox.textContent = '二维码加载失败'; return; }
  qrInstance = new QRCode(qrBox, {
    text: normalizeWechatInAppLink(text),
    width: 200, height: 200,
    colorDark: '#111827', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
}

function showQrModal(b) {
  renderQrCode(b.link);
  qrAccountName.textContent = b.name;
  qrModal.classList.add('is-open');
  qrModal.setAttribute('aria-hidden', 'false');
}

function closeQrModal() {
  qrModal.classList.remove('is-open');
  qrModal.setAttribute('aria-hidden', 'true');
  qrBox.innerHTML = '';
}

function handleCardClick(b) {
  if (!b.link) return;
  if (isWeChatBrowser()) {
    window.location.replace(normalizeWechatInAppLink(b.link));
    return;
  }
  if (isWechatProfileLink(b.link)) { showQrModal(b); return; }
  window.open(b.link, '_blank');
}

document.getElementById('cardGrid').addEventListener('click', function (e) {
  const card = e.target.closest('.card');
  if (!card) return;
  const b = BLOGGERS[parseInt(card.dataset.idx, 10)];
  if (b) handleCardClick(b);
});

qrClose.addEventListener('click', closeQrModal);
qrModal.addEventListener('click', function (e) { if (e.target === qrModal) closeQrModal(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && qrModal.classList.contains('is-open')) closeQrModal();
});
</script>
