<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<title>火箭叔精选 Skill — 开源 AI 工具精选集</title>
<style>
/* ═══════ Design Tokens (same as index) ═══════ */
:root {
  --bg:        #fafaf9;
  --bg-alt:    #f5f4f1;
  --surface:   #ffffff;
  --border:    #e8e5e0;
  --border-v:  #d6d3ce;
  --text:      #1a1816;
  --text2:     #5c5955;
  --text3:     #999692;
  --accent:    #0d9488;
  --accent-subtle: #f0fdf9;
  --accent-glow: rgba(13,148,136,.12);
  --amber:     #d97706;
  --font-display: "Outfit", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --shadow-hover: 0 0 0 1px rgba(13,148,136,.08), 0 4px 20px rgba(0,0,0,.08), 0 0 40px rgba(13,148,136,.06);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --nav-h: 56px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ═══════ Nav ═══════ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-h);
  background:rgba(250,250,249,.88);
  backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid var(--border);
}
.nav-inner{
  max-width:1200px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;height:100%;
}
.nav-logo{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text);
  text-decoration:none;letter-spacing:-.02em;transition:color .2s;
}
.nav-logo:hover{color:var(--accent)}
.nav-back{
  font-size:13px;color:var(--text2);text-decoration:none;
  display:flex;align-items:center;gap:4px;transition:color .2s;
}
.nav-back:hover{color:var(--accent)}

/* ═══════ Hero ═══════ */
.hero{
  margin-top:var(--nav-h);padding:64px 24px 40px;text-align:center;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:500px;height:500px;
  background:radial-gradient(ellipse at center,var(--accent-glow) 0%,transparent 65%);
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1;max-width:640px;margin:0 auto}
.hero h1{
  font-family:var(--font-display);
  font-size:clamp(32px,5vw,48px);font-weight:800;
  letter-spacing:-.04em;line-height:1.12;margin-bottom:16px;
}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--accent),#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:16px;color:var(--text2);max-width:460px;margin:0 auto;line-height:1.6}
.hero-stat{
  display:inline-flex;align-items:center;gap:6px;margin-top:20px;
  font-size:14px;font-weight:600;color:var(--accent);
  background:var(--accent-subtle);padding:6px 16px;border-radius:20px;
}

/* ═══════ Grid ═══════ */
.section{padding:32px 24px 64px}
.section-inner{max-width:1200px;margin:0 auto}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ═══════ Card ═══════ */
.skill-card{
  display:flex;align-items:center;gap:16px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:16px 20px;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  text-decoration:none;color:inherit;cursor:pointer;
}
.skill-card:hover{border-color:var(--accent);box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.skill-body{flex:1;min-width:0}
.skill-name{
  font-family:var(--font-display);font-size:14px;font-weight:700;
  letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.skill-desc{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skill-star{
  flex-shrink:0;font-size:13px;font-weight:700;color:var(--amber);
  display:flex;align-items:center;gap:3px;white-space:nowrap;
  background:var(--bg-alt);padding:5px 10px;border-radius:6px;
}
.skill-star.no-star{color:var(--text3);font-weight:400;font-size:12px}
.skill-arrow{font-size:14px;color:var(--text3);flex-shrink:0;transition:transform .2s}
.skill-card:hover .skill-arrow{transform:translateX(3px);color:var(--accent)}

/* ═══════ Footer ═══════ */
.footer{padding:32px 24px;border-top:1px solid var(--border);text-align:center;font-size:13px;color:var(--text3)}

/* ═══════ Responsive ═══════ */
@media(max-width:900px){.skills-grid{grid-template-columns:1fr}}
@media(max-width:600px){
  .skill-card{padding:14px 16px}
  .skill-name{font-size:13px}
  .skill-desc{font-size:11px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">🧰 火箭叔精选 Skill</a>
    <a href="/" class="nav-back">&larr; 返回首页</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-inner">
    <h1>开源 AI 工具 <em>精选集</em></h1>
    <p>精选 GitHub 优质开源项目，覆盖 AI Agent、内容处理、浏览器自动化、微信生态等领域。点击卡片直达仓库。</p>
    <div class="hero-stat">📦 共收录 <strong>33</strong> 个精选项目</div>
  </div>
</section>

<section class="section">
  <div class="section-inner">
    <div class="skills-grid" id="skillsGrid"></div>
  </div>
</section>

<footer class="footer">
  <span>Chrisgao AI &copy; 2026</span> &nbsp;|&nbsp;
  <a href="/" style="color:var(--text2);text-decoration:none">返回首页</a>
</footer>

<script>
const SKILLS = [
  { repo:"nousresearch/hermes-agent",           stars:"222K",  desc:"高质量 AI Agent 训练数据集与模型，支持工具调用、结构化推理和函数执行，是构建自主 Agent 的基石" },
  { repo:"yt-dlp/yt-dlp",                       stars:"181K",  desc:"万能视频下载器，支持 YouTube/B站/抖音等数千网站，可选分辨率与格式，支持字幕提取和播放列表批量下载" },
  { repo:"microsoft/markitdown",                stars:"170K",  desc:"微软出品：将 Office 文档、PDF、图片、网页一键转成干净的 Markdown，为 AI 处理准备好结构化素材" },
  { repo:"clash-verge-rev/clash-verge-rev",     stars:"134K",  desc:"跨平台网络代理客户端，图形化界面支持多协议规则分流，一键切换节点，内置系统代理和 TUN 模式" },
  { repo:"opendatalab/mineru",                  stars:"76K",   desc:"高精度 PDF/Office 转 Markdown，保留表格、公式、图片和排版结构，RAG 知识库和数据分析的文档预处理利器" },
  { repo:"Panniantong/agent-reach",             stars:"62K",   desc:"AI Agent 全网触达引擎：自动搜索、浏览网页、采集信息，像真人一样在互联网上自主完成调研任务" },
  { repo:"ChromeDevTools/chrome-devtools-mcp",  stars:"48K",   desc:"让 AI 直接操控 Chrome 开发者工具：审查元素、监控网络请求、执行 JS、性能分析，自动化测试与网页抓取利器" },
  { repo:"vercel-labs/agent-browser",           stars:"39K",   desc:"Vercel 出品：AI 驱动的浏览器 Agent，可以像真人一样浏览网页、点击按钮、填写表单、截图和抓取数据" },
  { repo:"Chanzhaoyu/chatgpt-web",              stars:"31K",   desc:"自部署 ChatGPT 网页客户端，支持多轮对话、历史记录管理、自定义 API Key，数据完全掌握在自己手里" },
  { repo:"GaiZhenbiao/ChuanhuChatGPT",          stars:"15K",   desc:"川虎 ChatGPT：功能丰富的 AI 聊天界面，支持多模型切换、插件扩展、Markdown/LaTeX 渲染和文件上传分析" },
  { repo:"wechat-article/wechat-article-exporter",stars:"12.5K",desc:"一键批量导出微信公众号文章为 PDF/HTML/Markdown，自动下载文中图片，做知识库沉淀和竞品分析的必备工具" },
  { repo:"s0md3v/roop",                         stars:"3.5K",  desc:"一键 AI 换脸工具：支持图片、视频和实时摄像头画面中人脸的替换，无需训练模型，即开即用" },
  { repo:"iBigQiang/feedgrab",                  stars:"582",   desc:"通用内容抓取器：从 RSS、网页、API 等多种来源提取结构化数据，支持自定义规则，做信息聚合和舆情监控" },
  { repo:"joeseesun/qiaomu-wx-video",           stars:"83",    desc:"微信视频号视频下载工具：粘贴视频号链接即可下载高清无水印视频，方便素材收集和内容存档" },
  { repo:"mymark21/tt-bridge",                  stars:"4",     desc:"浏览器控制桥接工具：打通浏览器扩展与外部应用的通信通道，实现跨进程自动化操控网页和浏览器行为" },
  { repo:"wenmengjie82/meng-wx-history-summarize",stars:"1",   desc:"微信聊天记录智能分析与总结：自动提取群聊/私聊中的关键信息、待办事项、重要决策，再也不用爬楼翻记录" },
  { repo:"noique/cross-border-ecommerce-skills",stars:"",     desc:"跨境电商专属 Claude Skills 集合：红人开发、竞品分析、邮件营销、SEO 等场景的 Prompt 模板和自动化工作流" },
  { repo:"Fei-Away/Codex-Dream-Skin",           stars:"",     desc:"Codex Dream Skin：梦幻配色的 VS Code 精美主题皮肤，护眼暗色 + 精致图标，让每天写代码都有仪式感" },
  { repo:"zarazhangrui/beautiful-html-templates",stars:"",    desc:"精美 HTML 模板合集：涵盖登录页、落地页、Dashboard、个人主页等多种场景，设计现代、代码干净、即拿即用" },
  { repo:"zarazhangrui/frontend-slides",        stars:"",     desc:"用前端技术（HTML/CSS/JS）制作演示幻灯片，比 PPT 更灵活自由，支持代码高亮、交互动画和响应式布局" },
  { repo:"googleanalytics/google-analytics-mcp",stars:"",     desc:"MCP 服务器让 AI 直连 Google Analytics：自动查询网站流量、用户行为、转化率，生成数据洞察报告，告别手动拉报表" },
  { repo:"dontbesilent2025/dbskill",            stars:"",     desc:"通用 Claude Skill 工具包：集成文件处理、网页抓取、数据转换等常用功能，一个 Skill 搞定日常重复性 AI 任务" },
  { repo:"BlueMatthew/WechatExporter",          stars:"",     desc:"微信聊天记录完整导出工具：支持文字、图片、语音、视频全类型消息，输出 HTML/TXT 格式，保留原始时间线和联系人" },
  { repo:"godly-devotion/MochiDiffusion",       stars:"",     desc:"Mac 原生 Stable Diffusion AI 绘图客户端：SwiftUI 精美界面，无需联网，本地运行保护隐私，支持多种模型和参数调节" },
  { repo:"zongjianpeng/jd_maota",              stars:"",     desc:"京东茅台抢购助手：自动监控库存状态、模拟下单流程，在茅台放货瞬间自动提交订单，大幅提升抢购成功率" },
  { repo:"hwchase17/langchainjs",               stars:"",     desc:"LangChain 官方 JavaScript/TypeScript SDK：构建 LLM 应用的标准框架，支持链式调用、向量数据库、Agent 编排等核心能力" },
  { repo:"sunner/ChatALL",                      stars:"",     desc:"同时向 ChatGPT、Claude、Gemini、文心一言等多个 AI 提问，并排对比各家的回答质量，一次提问多方验证" },
  { repo:"chathub-dev/chathub",                 stars:"",     desc:"聊天 Hub：一个界面统一接入多个 AI 对话平台，集中管理不同 AI 的对话历史，无需在多个网页间来回切换" },
  { repo:"Chanzhaoyu/chatgpt-web-plus",         stars:"",     desc:"ChatGPT 网页增强版：在开源 web 客户端基础上增加了提示词库、对话导出、角色预设、多 API Key 管理等高级功能" },
  { repo:"xcanwin/KeepChatGPT",                 stars:"",     desc:"ChatGPT 防断连浏览器扩展：自动检测并修复网络错误、防止掉线、抑制报错弹窗，让长时间 AI 对话稳定不中断" },
  { repo:"fuergaosi233/wechat-chatgpt",         stars:"",     desc:"微信接入 ChatGPT：在微信里使用 AI 自动回复消息，支持私聊和群聊场景，可设置关键词触发和上下文记忆" },
  { repo:"ourongxing/chatgpt-vercel",           stars:"",     desc:"Vercel 一键部署 ChatGPT 网页版：无需服务器、无需数据库，3 分钟拥有自己的 ChatGPT 站点，支持自定义域名和 API Key" },
  { repo:"liaokongVFX/LangChain-Chinese-Getting-Started-Guide",stars:"",desc:"LangChain 中文入门教程：从环境搭建到项目实战，配套完整代码示例和中文讲解，零基础也能学会构建 LLM 应用" },
];

(function render() {
  let html = '';
  SKILLS.forEach(s => {
    const starHtml = s.stars
      ? `<span class="skill-star">⭐ ${s.stars}</span>`
      : `<span class="skill-star no-star">—</span>`;
    html += `<a class="skill-card" href="https://github.com/${s.repo}" target="_blank" rel="noopener" title="在 GitHub 打开 ${s.repo}">
      <div class="skill-body">
        <div class="skill-name">${s.repo}</div>
        <div class="skill-desc">${s.desc}</div>
      </div>
      ${starHtml}
      <span class="skill-arrow">&rarr;</span>
    </a>`;
  });
  document.getElementById("skillsGrid").innerHTML = html;
})();
</script>
</body>
</html>
