/* ═══════ Design Tokens (same as index) ═══════ */
:root {
  --bg:        #fafaf9;
  --bg-alt:    #f5f4f1;
  --surface:   #ffffff;
  --border:    #e8e5e0;
  --border-v:  #d6d3ce;
  --text:      #1a1816;
  --text2:     #5c5955;
  --text3:     #999692;
  --accent:    #0d9488;
  --accent-subtle: #f0fdf9;
  --accent-glow: rgba(13,148,136,.12);
  --amber:     #d97706;
  --font-display: "Outfit", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --shadow-hover: 0 0 0 1px rgba(13,148,136,.08), 0 4px 20px rgba(0,0,0,.08), 0 0 40px rgba(13,148,136,.06);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --nav-h: 56px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ═══════ Nav ═══════ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-h);
  background:rgba(250,250,249,.88);
  backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid var(--border);
}
.nav-inner{
  max-width:1200px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;height:100%;
}
.nav-logo{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text);
  text-decoration:none;letter-spacing:-.02em;transition:color .2s;
}
.nav-logo:hover{color:var(--accent)}
.nav-back{
  font-size:13px;color:var(--text2);text-decoration:none;
  display:flex;align-items:center;gap:4px;transition:color .2s;
}
.nav-back:hover{color:var(--accent)}

/* ═══════ Hero ═══════ */
.hero{
  margin-top:var(--nav-h);padding:64px 24px 40px;text-align:center;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:500px;height:500px;
  background:radial-gradient(ellipse at center,var(--accent-glow) 0%,transparent 65%);
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1;max-width:640px;margin:0 auto}
.hero h1{
  font-family:var(--font-display);
  font-size:clamp(32px,5vw,48px);font-weight:800;
  letter-spacing:-.04em;line-height:1.12;margin-bottom:16px;
}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--accent),#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:16px;color:var(--text2);max-width:460px;margin:0 auto;line-height:1.6}
.hero-stat{
  display:inline-flex;align-items:center;gap:6px;margin-top:20px;
  font-size:14px;font-weight:600;color:var(--accent);
  background:var(--accent-subtle);padding:6px 16px;border-radius:20px;
}

/* ═══════ Category ═══════ */
.cat-group{margin-bottom:40px}
.cat-header{
  display:flex;align-items:baseline;gap:10px;margin-bottom:5px;
  padding-bottom:8px;border-bottom:2px solid var(--accent-glow);
}
.cat-title{
  font-family:var(--font-display);font-size:18px;font-weight:700;
  letter-spacing:-.02em;color:var(--text);
}
.cat-count{
  font-size:12px;font-weight:500;color:var(--text3);
  background:var(--bg-alt);padding:2px 10px;border-radius:10px;
}
.cat-desc{font-size:13px;color:var(--text3);margin-bottom:14px;line-height:1.5}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media(max-width:900px){.cat-grid{grid-template-columns:1fr}}

/* ═══════ Card ═══════ */
.skill-card{
  display:flex;align-items:center;gap:16px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:16px 20px;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  text-decoration:none;color:inherit;cursor:pointer;
}
.skill-card:hover{border-color:var(--accent);box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.skill-body{flex:1;min-width:0}
.skill-name{
  font-family:var(--font-display);font-size:14px;font-weight:700;
  letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.skill-desc{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skill-star{
  flex-shrink:0;font-size:13px;font-weight:700;color:var(--amber);
  display:flex;align-items:center;gap:3px;white-space:nowrap;
  background:var(--bg-alt);padding:5px 10px;border-radius:6px;

.skill-star.no-star{color:var(--text3);font-weight:400;font-size:12px}
.skill-arrow{font-size:14px;color:var(--text3);flex-shrink:0;transition:transform .2s}
.skill-card:hover .skill-arrow{transform:translateX(3px);color:var(--accent)}

/* ═══════ Content container ═══════ */
.section{padding:0}
.section-inner{max-width:1200px;margin:0 auto;padding:28px 24px 60px}

/* ═══════ Filter Bar (借鉴自跨境博主导航) ═══════ */
.controls{
  position:sticky;top:var(--nav-h);z-index:900;
  background:rgba(250,250,249,.92);
  backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);
  border-bottom:1px solid var(--border);
  padding:12px 0;
}
.controls-inner{max-width:1200px;margin:0 auto;padding:0 24px}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-label{font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.filter-pill{
  font-size:12.5px;font-weight:600;padding:5px 14px;border-radius:999px;
  border:1.5px solid var(--border);background:var(--surface);color:var(--text2);
  cursor:pointer;transition:all .2s ease;white-space:nowrap;user-select:none;
}
.filter-pill:hover{border-color:var(--accent);color:var(--accent)}
.filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.filter-pill .count{font-size:11px;margin-left:2px;opacity:.72}
.search-row{display:flex;gap:10px;margin-top:10px;align-items:center}
.search-input{
  flex:1;font-size:14px;padding:8px 14px;border:1.5px solid var(--border);
  border-radius:10px;outline:none;background:var(--surface);
  color:var(--text);transition:border-color .2s ease;
}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}
.result-hint{font-size:13px;color:var(--text2);white-space:nowrap}
/* 空状态 */
.empty-state{padding:70px 20px;text-align:center;color:var(--text3)}
.empty-state .icon{font-size:44px;margin-bottom:12px}

/* ═══════ Footer ═══════ */
.footer{padding:32px 24px;border-top:1px solid var(--border);text-align:center;font-size:13px;color:var(--text3)}

/* ═══════ Responsive ═══════ */
@media(max-width:900px){.skills-grid{grid-template-columns:1fr}}
@media(max-width:600px){

  let activeCategory = 'all';
  let searchQuery = '';

  // ===== 分类筛选按钮 =====
  function buildFilterBar() {
    const bar = document.getElementById('filterBar');
    document.getElementById('countAll').textContent = '(' + TOTAL + ')';

    CATEGORIES.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-pill';
      btn.dataset.cat = cat.name;
      btn.innerHTML = cat.name + '<span class="count">' + cat.skills.length + '</span>';
      btn.addEventListener('click', () => {
        bar.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = cat.name;
        render();
      });
      bar.appendChild(btn);
    });

    bar.querySelector('[data-cat="all"]').addEventListener('click', () => {
      bar.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      bar.querySelector('[data-cat="all"]').classList.add('active');
      activeCategory = 'all';
      render();
    });
  }

  // ===== 渲染（分类 + 搜索 组合过滤） =====
  function render() {
    const container = document.getElementById('skillsGroups');
    const hint = document.getElementById('resultHint');
    const q = searchQuery.trim().toLowerCase();

    let html = '';
    let shown = 0;

    CATEGORIES
      .filter(cat => activeCategory === 'all' || cat.name === activeCategory)
      .forEach(cat => {
        const skills = q
          ? cat.skills.filter(s => (s.repo + ' ' + s.desc).toLowerCase().includes(q))
          : cat.skills;
        if (skills.length === 0) return;
        shown += skills.length;

        html += `<div class="cat-group">
      <div class="cat-header">
        <span class="cat-title">${cat.icon} ${cat.name}</span>
        <span class="cat-count">${skills.length} 个</span>
      </div>
      <div class="cat-desc">${cat.desc}</div>
      <div class="cat-grid">`;

        skills.forEach(s => {
          const starHtml = s.stars
            ? `<span class="skill-star">⭐ ${s.stars}</span>`
            : `<span class="skill-star no-star">—</span>`;
          html += `<a class="skill-card" href="https://github.com/${s.repo}" target="_blank" rel="noopener" title="在 GitHub 打开 ${s.repo}">
        <div class="skill-body">
          <div class="skill-name">${s.repo}</div>
          <div class="skill-desc">${s.desc}</div>
        </div>
        ${starHtml}
        <span class="skill-arrow">&rarr;</span>
      </a>`;
        });

        html += `</div></div>`;
      });

    if (shown === 0) {
      html = `<div class="empty-state"><div class="icon">🔍</div><p>没有找到匹配的 Skill，换个关键词试试</p></div>`;
    }

    hint.textContent = searchQuery.trim()
      ? `找到 ${shown} / ${TOTAL} 个`
      : (activeCategory === 'all'
          ? `共 ${TOTAL} 个精选项目`
          : `「${activeCategory}」${shown} 个 / 共 ${TOTAL} 个`);

    container.innerHTML = html;
  }

  // ===== 搜索（防抖 200ms） =====
  const searchInput = document.getElementById('searchInput');
  let timer;
  searchInput.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { searchQuery = searchInput.value; render(); }, 200);
  });

  buildFilterBar();
  render();
})();
</script>
</body>
</html>
